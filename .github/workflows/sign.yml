name: Netease Daily Sign

on:
  schedule:
    - cron: "35 20 * * *"   # 每天 04:35 (UTC+8)
    - cron: "30 14 * * *"   # 每天 22:30 (UTC+8)
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run sign
        run: node sign.js
        env:
          TZ: Asia/Shanghai
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          # Server酱：填了就推送到微信，不填就不发
          SERVERCHAN_SEND_URL: ${{ secrets.SERVERCHAN_SEND_URL }}
          # 钉钉（可选）：填了就发，不填就不发
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
